name: Autonomous System CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Run simulation
        run: |
          python run_simulation.py --scenario test_scenario_01.json

      - name: Build Docker image
        run: |
          docker build -t autonomous-service:ci .

      - name: Test Docker container
        run: |
          docker run --rm autonomous-service:ci
